
name: Build Masteran Burung Jawara APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name 'Masteran_Burung_Jawara_Project.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP proyek tidak ditemukan"
            exit 1
          fi
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source

      - name: Build APK
        run: |
          PROJECT_DIR=$(find source -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "File settings.gradle.kts tidak ditemukan"
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masteran-Burung-Jawara-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
