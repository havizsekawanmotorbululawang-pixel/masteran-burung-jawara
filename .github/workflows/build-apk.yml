
name: Build Masteran Burung Jawara APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find Project ZIP
        run: |
          ZIP_FILE=$(find . -type f -iname 'Masteran_Burung_Premium_Project.zip' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP proyek tidak ditemukan!"
            echo "Upload ZIP proyek ke repository GitHub."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Project ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/unpacked"

          GRADLEW=$(find "$RUNNER_TEMP/unpacked" -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew tidak ditemukan dalam ZIP!"
            find "$RUNNER_TEMP/unpacked" -maxdepth 3 -type f | head -50
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Folder proyek: $PROJECT_DIR"

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant Gradle Permission
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak berhasil dibuat!"
            exit 1
          fi

          echo "APK ditemukan: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masteran-Burung-Premium-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
